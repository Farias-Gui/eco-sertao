services:
  - type: web
    name: eco-sertao
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1 worker: o agendador roda dentro do processo; mais workers duplicariam as buscas.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
